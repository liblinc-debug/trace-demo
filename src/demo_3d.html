    // 解析 CSV
    const lines = fullCSV.trim().split('\n');
    const points = [];
    for (let i = 1; i < lines.length; i++) {
        const vals = lines[i].split(',');
        if (vals.length < 5) continue;
        const lat = parseFloat(vals[1]);
        const lng = parseFloat(vals[2]);
        const alt = parseFloat(vals[3]);
        if (!isNaN(lat) && !isNaN(lng) && !isNaN(alt)) {
            points.push({ lat, lng, alt });
        }
    }
    document.getElementById('point-count').innerText = points.length;
    const alts = points.map(p => p.alt);
    const maxAlt = Math.max(...alts).toFixed(1);
    const minAlt = Math.min(...alts).toFixed(1);
    document.getElementById('max-alt').innerText = maxAlt;
    document.getElementById('min-alt').innerText = minAlt;

    // 1. 初始化地图 (强制3D)
    const map = new AMap.Map('container', {
        zoom: 18,
        center: [points[0].lng, points[0].lat],
        viewMode: '3D',
        pitch: 70,
        rotation: -20,
        mapStyle: 'amap://styles/blue',
        showBuildingBlock: true,
        buildingAnimation: true,
        layers: [new AMap.TileLayer.Satellite()]
    });

    // 2. 初始化 Loca 容器
    const loca = new Loca.Container({
        map: map
    });

    // 3. 构建三维坐标数据 [lng, lat, alt] —— 确保每个子数组都是三个数字
    const coordinates3D = points.map(p => [p.lng, p.lat, p.alt]);

    // 4. 创建 GeoJSON 数据源
    const geoSource = new Loca.GeoJSONSource({
        data: {
            type: 'FeatureCollection',
            features: [
                {
                    type: 'Feature',
                    properties: {},
                    geometry: {
                        type: 'LineString',
                        coordinates: coordinates3D
                    }
                }
            ]
        }
    });

    // 5. 创建 LineLayer 并配置样式 (使用固定颜色，避免渐变函数可能导致的错误)
    const lineLayer = new Loca.LineLayer({
        zIndex: 30,
        opacity: 1,
        visible: true,
        blendMode: 'normal'
    });

    // 设置数据源和样式
    lineLayer.setSource(geoSource, {
        lineWidth: 6.0,                       // 线宽
        height: function(index, feature) {    // 关键：明确返回每个顶点的高度（米）
            return feature.geometry.coordinates[index][2];
        },
        color: '#ffaa33',                      // 固定橙色，确保先显示线条
        // 如果需要渐变，后续可以再调试，先保证线条出现
    });

    // 6. 将图层添加到 Loca 容器并渲染
    loca.add(lineLayer);
    loca.animate.start();

    // 7. 添加标记 (起点、最高点、远端)
    const start = points[0];
    const maxPoint = points.reduce((a, b) => a.alt > b.alt ? a : b);
    const farPoint = points[28] || points[25]; // 远端

    new AMap.Marker({
        position: [start.lng, start.lat, 0],
        content: '<div style="background:#2ecc71; width:26px; height:26px; border-radius:6px; border:3px solid white; box-shadow:0 0 20px #2ecc71; text-align:center; line-height:26px;">🚁</div>',
        offset: new AMap.Pixel(-13, -13)
    }).setMap(map);

    new AMap.Marker({
        position: [maxPoint.lng, maxPoint.lat, maxPoint.alt],
        content: '<div style="background:#e74c3c; width:26px; height:26px; border-radius:50%; border:3px solid white; box-shadow:0 0 20px red; text-align:center; line-height:26px;">▲</div>',
        offset: new AMap.Pixel(-13, -13)
    }).setMap(map);

    new AMap.Marker({
        position: [farPoint.lng, farPoint.lat, farPoint.alt],
        content: '<div style="background:#3b9eff; width:24px; height:24px; border-radius:4px; border:2px solid white; box-shadow:0 0 20px #3b9eff; text-align:center; line-height:24px;">⛳</div>',
        offset: new AMap.Pixel(-12, -12)
    }).setMap(map);

    // 自适应视野
    const bounds = new AMap.Bounds();
    points.forEach(p => bounds.extend(new AMap.LngLat(p.lng, p.lat)));
    map.setBounds(bounds);
    setTimeout(() => map.setPitch(70), 500);
